<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Connect · 电脑接收页</title>
  <link rel="stylesheet" href="/files-ui.css">
  <script src="/i18n.js"></script>
  <script src="/files-ui.js"></script>
  <style>
    body { max-width: 1400px; margin: 0 auto; padding: 28px clamp(18px, 3vw, 44px) 64px; }
    .box { min-height: 270px; max-height: 55vh; overflow: auto; padding: 18px 20px; border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface-soft); white-space: pre-wrap; overflow-wrap: anywhere; line-height: 1.75; }
    #status { min-height: 1.5em; }
    #connect-panel { position: relative; padding: 25px 28px; margin: 24px 0; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-soft); }
    #connect-panel:not(.has-qr)::before { content: ''; position: absolute; top: 26px; bottom: 26px; left: 0; width: 4px; border-radius: 0 4px 4px 0; background: var(--accent); }
    #connect-panel h2 { margin: 0 0 8px; font-size: clamp(20px, 2vw, 25px); letter-spacing: -.025em; }
    #connect-panel p { margin: 8px 0 0; max-width: 72ch; }
    #connect-panel.has-qr { display: grid; grid-template-columns: 152px minmax(0, 1fr) 208px; grid-template-areas: "steps title qr" "steps instruction qr" "steps detail qr"; gap: 4px 26px; align-items: start; }
    .connect-timeline { grid-area: steps; position: relative; align-self: stretch; min-height: 205px; --timeline-progress: 0; }
    .connect-steps { position: relative; display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; height: 100%; min-height: 205px; margin: 0; padding: 4px 0; list-style: none; }
    .connect-steps::before { content: ''; position: absolute; z-index: 0; top: 48px; bottom: 48px; left: 21px; width: 4px; border-radius: 4px; background: #dfdfdf; }
    .connect-line-fill { position: absolute; z-index: 0; top: 48px; left: 21px; width: 4px; height: calc(100% - 96px); border-radius: 4px; background: var(--accent); box-shadow: 0 0 9px #19191965; transform: scaleY(var(--timeline-progress)); transform-origin: top; pointer-events: none; }
    .connect-step { position: relative; z-index: 1; display: flex; align-items: center; gap: 9px; color: var(--text-muted); font-size: 12px; font-weight: 650; white-space: nowrap; }
    .step-dot { display: grid; place-items: center; flex: 0 0 44px; width: 44px; height: 44px; border: 2px solid #c2c2c2; border-radius: 50%; color: var(--text-muted); background: var(--surface); box-shadow: 0 1px 4px #47474712; font-size: 15px; transition: background .32s, border-color .32s, color .32s, box-shadow .32s; }
    .connect-step[aria-current="step"] .step-dot { border-color: var(--accent); box-shadow: 0 0 0 5px #19191916; }
    .connect-steps[data-stage="1"] .step-wifi .step-dot, .connect-steps[data-stage="2"] .step-wifi .step-dot, .connect-steps.is-complete .step-web .step-dot { border-color: var(--accent); color: white; background: var(--accent); }
    .connect-steps.is-complete .step-web { color: var(--accent-deep); transition: color .32s; }
    .connect-steps[data-stage="1"] .step-wifi .step-dot { animation: step-light .65s ease-out; }
    .connect-steps.is-complete .step-web .step-dot { animation: step-light .65s ease-out; }
    @keyframes step-light { 0% { box-shadow: 0 0 0 0 #19191950; transform: scale(.9); } 65% { box-shadow: 0 0 0 11px #19191900; transform: scale(1.08); } 100% { box-shadow: 0 0 0 0 #19191900; transform: scale(1); } }
    #connect-title { grid-area: title; }
    #connect-instruction { grid-area: instruction; }
    #connect-detail { grid-area: detail; }
    #connect-qr { grid-area: qr; display: block; width: 208px; height: 208px; max-width: 100%; margin: 0; padding: 8px; box-sizing: border-box; border: 1px solid var(--border); border-radius: 14px; background: white; }
    #connect-qr[hidden] { display: none; }
    #connect-detail { color: var(--accent-deep); overflow-wrap: anywhere; font-weight: 600; }
    .receiver-layout { display: grid; grid-template-columns: minmax(300px, .82fr) minmax(0, 1.7fr); gap: 20px; align-items: stretch; }
    .text-workspace { display: flex; flex-direction: column; min-width: 0; height: 100%; padding: 24px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-soft); }
    .text-workspace .box { flex: 1; max-height: none; }
    .text-workspace h2 { margin: 0 0 8px; }
    .text-workspace > p:first-of-type { margin: 0 0 20px; color: var(--text-muted); }
    .text-workspace #copy { margin-top: 18px; }
    .receiver-layout .files-workspace { min-width: 0; margin-top: 0; }
    @media (max-width: 960px) {
      body { padding: 20px 16px 48px; }
      .receiver-layout { grid-template-columns: minmax(0, 1fr); align-items: start; }
      .text-workspace { height: auto; }
      .text-workspace .box { min-height: 150px; max-height: 55vh; flex: auto; }
    }
    @media (max-width: 780px) {
      #connect-panel.has-qr { display: flex; flex-direction: column; }
      #connect-panel { padding: 22px 20px; }
      #connect-qr { width: 200px; height: 200px; margin-top: 16px; }
      .connect-timeline, .connect-steps { min-height: 82px; width: 100%; }
      .connect-steps { flex-direction: row; padding: 0; }
      .connect-steps::before { top: 21px; right: 44px; bottom: auto; left: 44px; width: auto; height: 4px; }
      .connect-line-fill { top: 21px; left: 44px; width: calc(100% - 88px); height: 4px; transform: scaleX(var(--timeline-progress)); transform-origin: left; }
      .connect-step { flex-direction: column; align-items: flex-start; gap: 4px; }
      .step-web { align-items: flex-end; }
      .text-workspace { padding: 20px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .step-dot, .connect-steps.is-complete .step-web { transition: none; }
      .connect-step .step-dot { animation: none !important; }
    }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-row"><div class="app-brand"><span>Local Connect</span><span class="brand-context">电脑接收</span></div><button id="language-toggle" class="language-toggle" type="button">EN</button></div>
    <h1>接收工作台</h1>
    <p>扫码连接手机，文字和文件会直接出现在这里。</p>
  </header>
  <p class="session-note">每次打开或刷新此页会清空本次记录；文件仍保存在电脑上。关闭所有接收页后，服务和热点将自动结束。</p>
  <section id="connect-panel" aria-live="polite">
    <div id="connect-timeline" class="connect-timeline" hidden>
    <ol id="connect-steps" class="connect-steps" data-stage="0" aria-label="扫码进度">
      <li class="connect-step step-wifi" aria-current="step"><span class="step-dot" aria-hidden="true">1</span><span>连接热点</span></li>
      <li class="connect-step step-web"><span class="step-dot" aria-hidden="true">2</span><span>打开传输页</span></li>
    </ol>
    <span id="connect-line-fill" class="connect-line-fill" aria-hidden="true"></span>
    </div>
    <h2 id="connect-title">正在检查连接方式…</h2>
    <p id="connect-instruction"></p>
    <img id="connect-qr" alt="连接二维码" hidden>
    <p id="connect-detail"></p>
  </section>
  <main class="receiver-layout">
    <section class="text-workspace" aria-label="收到的文本">
      <h2>收到的文本</h2>
      <p>手机发送的最新文本会显示在这里。</p>
      <div id="text" class="box" aria-live="polite" data-i18n-user-content></div>
      <p id="text-count" class="character-count" title="按 Unicode 字符计数，包含空格与换行">0 字符</p>
      <button id="copy" type="button" disabled>复制文本</button>
      <p id="status" role="status" aria-live="polite">等待文本…</p>
    </section>
    <section class="files-workspace">
    <div class="files-toolbar"><h2>收到的文件</h2><button id="add-pdf" type="button" disabled>＋ PDF 容器</button></div>
    <p>点击文件可下载；拖入 PDF 容器合并，拖出可恢复原文件。图片支持排序与旋转；勾选后可下载指定文件。</p>
    <p id="pdf-support"></p>
    <p id="files-folder"></p>
    <div id="files-empty" class="empty-files">等待手机上传文件…</div>
    <ul id="file-list" class="file-grid" aria-label="收到的文件与 PDF 容器" data-i18n-user-content></ul>
    <div class="files-footer"><span id="files-total">0 个原文件 · 总大小 0 B</span><button id="download-all" type="button" disabled>一键下载 ZIP ↓</button></div>
    <p id="files-status" role="status" aria-live="polite"></p>
    </section>
  </main>
  <script src="/pdf-ui.js"></script>
  <script>
    LocalI18n.init();
    const t = LocalI18n.t;
    const connectTitle = document.getElementById("connect-title");
    const connectPanel = document.getElementById("connect-panel");
    const connectInstruction = document.getElementById("connect-instruction");
    const connectQr = document.getElementById("connect-qr");
    const connectDetail = document.getElementById("connect-detail");
    const connectTimeline = document.getElementById("connect-timeline");
    const connectSteps = document.getElementById("connect-steps");
    const wifiStep = connectSteps.querySelector(".step-wifi");
    const webStep = connectSteps.querySelector(".step-web");
    let connectionKey = "";
    let qrMode = "";
    let timelineStage = 0;
    let timelineProgress = 0;
    let timelineFrame = null;
    let timelineLastFrame = 0;
    let receiverReady = false;

    function setTimelineProgress(value) {
      timelineProgress = value;
      connectTimeline.style.setProperty("--timeline-progress", String(value));
    }

    function finishTimeline() {
      if (timelineStage !== 2 || timelineProgress < 1 || connectSteps.classList.contains("is-complete")) return;
      if (timelineFrame !== null) cancelAnimationFrame(timelineFrame);
      timelineFrame = null;
      setTimelineProgress(1);
      connectSteps.classList.add("is-complete");
      webStep.removeAttribute("aria-current");
    }

    function animateTimeline() {
      if (timelineFrame !== null || timelineProgress >= 1 || connectTimeline.hidden) return;
      timelineLastFrame = 0;
      function frame(timestamp) {
        if (timelineStage < 1 || connectTimeline.hidden) { timelineFrame = null; return; }
        if (document.hidden) {
          timelineLastFrame = 0;
          timelineFrame = requestAnimationFrame(frame);
          return;
        }
        if (timelineLastFrame) {
          const elapsed = Math.min(timestamp - timelineLastFrame, 50);
          setTimelineProgress(Math.min(1, timelineProgress + elapsed / 800));
        }
        timelineLastFrame = timestamp;
        if (timelineProgress < 1) timelineFrame = requestAnimationFrame(frame);
        else { timelineFrame = null; finishTimeline(); }
      }
      timelineFrame = requestAnimationFrame(frame);
    }

    function resetTimeline() {
      if (timelineFrame !== null) cancelAnimationFrame(timelineFrame);
      timelineFrame = null;
      timelineLastFrame = 0;
      setTimelineProgress(0);
      timelineStage = 0;
      connectSteps.dataset.stage = "0";
      connectSteps.classList.remove("is-complete");
      connectTimeline.hidden = true;
      wifiStep.setAttribute("aria-current", "step");
      webStep.removeAttribute("aria-current");
      qrMode = "";
    }

    function updateTimeline(mode, phoneOpened) {
      const hasQr = mode === "wifi" || mode === "web";
      if (connectTimeline.hidden === hasQr) connectTimeline.hidden = !hasQr;
      if (!hasQr) {
        if (timelineFrame !== null) cancelAnimationFrame(timelineFrame);
        timelineFrame = null;
        return;
      }
      const next = mode === "web" ? (phoneOpened ? 2 : 1) : 0;
      if (timelineStage < 1) {
        if (next < 1) return;
        timelineStage = 1;
        connectSteps.dataset.stage = "1";
        wifiStep.removeAttribute("aria-current");
        webStep.setAttribute("aria-current", "step");
        animateTimeline();
      }
      if (next === 2 && timelineStage < 2) {
        timelineStage = 2;
        connectSteps.dataset.stage = "2";
      }
      if (timelineProgress < 1) animateTimeline();
      else finishTimeline();
    }

    async function refreshConnection() {
      try {
        if (!receiverReady) return;
        const response = await fetch("/api/connect", { cache: "no-store" });
        if (!response.ok) throw new Error(t("连接状态读取失败"));
        const result = await response.json();
        updateTimeline(result.mode, result.phone_opened);
        const key = [result.mode, result.ssid, result.password, result.web_url, result.code, result.reason, result.phone_opened].join("|");
        if (key !== connectionKey) {
          connectionKey = key;
          connectQr.hidden = result.mode === "manual";
          connectPanel.classList.toggle("has-qr", result.mode !== "manual");
          if (result.mode === "wifi") {
            connectTitle.textContent = t("第一步：扫描二维码连接电脑热点");
            connectInstruction.textContent = t("用手机相机扫描并确认加入 Wi-Fi。连接成功后，这里会自动显示第二个二维码。");
            if (qrMode !== "wifi") { connectQr.src = "/api/connect/qr?wifi"; qrMode = "wifi"; }
            connectQr.alt = t("连接电脑热点的 Wi-Fi 二维码");
            connectDetail.textContent = t("热点名称：{ssid}　热点密码：{password}", result);
          } else if (result.mode === "web") {
            connectTitle.textContent = t(result.phone_opened ? "手机已打开传输页" : "第二步：扫描二维码打开传输页");
            connectInstruction.textContent = result.phone_opened
              ? t("两步连接已完成，可以在手机上发送文件或文本。")
              : t("手机已连接电脑热点。再次扫描下面的二维码，网页会自动填写本次访问码。");
            if (qrMode !== "web") { connectQr.src = "/api/connect/qr?web"; qrMode = "web"; }
            connectQr.alt = t("打开手机传输页的二维码");
            connectDetail.textContent = t("若扫码无法打开，请在手机浏览器输入 {url}，访问码 {code}。", {url: result.web_url, code: result.code});
          } else {
            connectTitle.textContent = t(result.reason === "hotspot_address_missing" ? "热点已开启，正在获取地址"
              : result.reason === "hotspot_listener_pending" ? "热点已开启，正在等待手机入口就绪" : "热点不可用");
            connectInstruction.textContent = result.reason === "hotspot_address_missing"
              ? t("电脑正在识别热点的 IPv4 地址，识别成功后会自动出现二维码。")
              : result.reason === "hotspot_listener_pending"
                ? t("电脑正在等待热点地址可用，准备好后会自动显示二维码。")
                : t("电脑热点无法使用，手机传输暂不可用。请检查 Windows 移动热点和 Wi-Fi 适配器后重启服务。");
            if (qrMode) { connectQr.removeAttribute("src"); qrMode = ""; }
            connectDetail.textContent = "";
          }
        }
      } catch {
        connectTitle.textContent = t("连接状态读取失败");
      } finally {
        setTimeout(refreshConnection, 3000);
      }
    }
    const textBox = document.getElementById("text");
    const copyButton = document.getElementById("copy");
    const status = document.getElementById("status");
    let latestVersion = -1;

    async function refresh() {
      try {
        if (!receiverReady) return;
        const response = await fetch("/api/latest", { cache: "no-store" });
        if (!response.ok) throw new Error("read failed");
        const result = await response.json();
        if (result.instance_id !== receiverInstance) return;
        PdfFiles.update(result);
        if (result.version !== latestVersion) {
          latestVersion = result.version;
          textBox.textContent = result.text;
          document.getElementById("text-count").textContent = t("{count} 字符", {count: LocalFiles.characterCount(result.text).toLocaleString(LocalI18n.language === "en" ? "en-US" : "zh-CN")});
          copyButton.disabled = !result.text;
          status.textContent = t(result.text ? "已收到最新文本。" : "等待文本…");
        }
      } catch {
        status.textContent = t("连接中断，正在重试…");
      } finally {
        setTimeout(refresh, 1000);
      }
    }

    async function copy(value) {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(value);
      } else {
        const temporary = document.createElement("textarea");
        temporary.value = value;
        temporary.style.position = "fixed";
        temporary.style.opacity = "0";
        document.body.appendChild(temporary);
        temporary.select();
        const copied = document.execCommand("copy");
        temporary.remove();
        if (!copied) throw new Error("copy failed");
      }
    }

    copyButton.addEventListener("click", async () => {
      try {
        await copy(textBox.textContent);
        status.textContent = t("已复制，可直接粘贴。");
      } catch {
        status.textContent = t("复制失败，请选中文本后手动复制。");
      }
    });

    const newPageId = () => Array.from(crypto.getRandomValues(new Uint8Array(16)), byte => byte.toString(16).padStart(2, "0")).join("");
    let pageId = newPageId();
    let receiverInstance = "";
    let receiverStream = null;
    let receiverLeaving = false;
    let receiverRegistering = false;
    let registrationRetry = null;
    let receiverToken = "";
    window.getReceiverToken = async () => {
      if (receiverToken) return receiverToken;
      const response = await fetch("/api/receiver/token", { cache: "no-store" });
      if (!response.ok) throw new Error("receiver token unavailable");
      receiverToken = (await response.json()).receiver_token;
      return receiverToken;
    };

    async function registerReceiver() {
      if (receiverLeaving || receiverRegistering) return;
      receiverRegistering = true;
      clearTimeout(registrationRetry);
      try {
        const token = await window.getReceiverToken();
        const response = await fetch("/api/receiver/open", {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ page_id: pageId, receiver_token: token })
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "无法连接服务");
        if (receiverLeaving) return;
        if (receiverInstance !== result.instance_id) {
          receiverInstance = result.instance_id;
          latestVersion = -1;
          PdfFiles.reset();
          connectionKey = "";
          resetTimeline();
        }
        if (receiverStream) receiverStream.close();
        receiverStream = new EventSource(`/api/receiver/events?page_id=${pageId}`);
        receiverStream.onerror = () => {
          receiverReady = false;
          receiverStream.close();
          if (!receiverLeaving) registrationRetry = setTimeout(registerReceiver, 1500);
        };
        receiverReady = true;
      } catch {
        receiverReady = false;
        status.textContent = t("服务未连接，请确认 Local Connect 正在运行。");
        if (!receiverLeaving) registrationRetry = setTimeout(registerReceiver, 1500);
      } finally {
        receiverRegistering = false;
      }
    }

    window.addEventListener("pagehide", () => {
      receiverLeaving = true;
      receiverReady = false;
      clearTimeout(registrationRetry);
      if (receiverStream) receiverStream.close();
      if (!receiverToken) return;
      const body = new Blob([JSON.stringify({ page_id: pageId, receiver_token: receiverToken })], { type: "application/json" });
      if (!navigator.sendBeacon("/api/receiver/close", body)) {
        fetch("/api/receiver/close", { method: "POST", body, keepalive: true }).catch(() => {});
      }
    });
    window.addEventListener("pageshow", event => {
      if (event.persisted) {
        receiverLeaving = false;
        pageId = newPageId();
        registerReceiver();
      }
    });
    registerReceiver();
    window.addEventListener("languagechange", () => {
      connectionKey = "";
      latestVersion = -1;
      refreshConnection(); refresh();
      PdfFiles.refreshLanguage();
    });
    refreshConnection();
    refresh();
  </script>
</body>
</html>
