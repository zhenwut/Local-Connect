<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Local Connect · 手机发送页</title>
  <link rel="stylesheet" href="/files-ui.css">
  <script src="/i18n.js"></script>
  <script src="/files-ui.js"></script>
  <style>
    body { max-width: 680px; margin: 0 auto; padding: 24px 16px 56px; }
    label { display: block; font-weight: 650; }
    input, textarea, button { box-sizing: border-box; font: inherit; }
    #manual-code, .phone-panel { padding: 22px; border: 1px solid var(--border); border-radius: var(--radius-lg); background: var(--surface); box-shadow: var(--shadow-soft); }
    #manual-code { margin: 22px 0 16px; }
    #manual-code label { margin-bottom: 10px; }
    .phone-panel { margin-top: 16px; }
    .phone-panel h2 { margin: 0 0 6px; }
    .phone-panel > p { margin: 0 0 18px; color: var(--text-muted); }
    #form label { margin: 18px 0 8px; }
    #text { min-height: 188px; resize: vertical; }
    #send { margin-top: 18px; width: 100%; }
    .phone-panel .character-count { margin: 8px 0 0; }
    #status, #photo-status { min-height: 1.5em; margin: 16px 0 0; }
    #retry-upload { width: 100%; margin-top: 14px; }
    .file-picker { display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 6px; min-height: 138px; padding: 18px; box-sizing: border-box; border: 1.5px dashed var(--accent-soft); border-radius: var(--radius-md); background: var(--accent-wash); color: var(--accent-deep); text-align: center; cursor: pointer; transition: border-color .18s, background .18s, transform .18s; }
    .file-picker:hover { border-color: var(--accent); background: var(--accent-wash-hover); transform: translateY(-2px); }
    .file-picker .picker-icon { display: grid; place-items: center; width: 38px; height: 38px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-soft); font-size: 23px; line-height: 1; }
    .file-picker small { color: var(--text-muted); font-size: 13px; font-weight: 400; }
    #photos { position: absolute; width: 1px; height: 1px; padding: 0; opacity: 0; }
    #photos:focus-visible + .file-picker { outline: 3px solid var(--focus); outline-offset: 3px; }
    #manual-code[hidden], #retry-upload[hidden] { display: none; }
    @media (max-width: 480px) { #manual-code, .phone-panel { padding: 18px; } }
  </style>
</head>
<body>
  <header class="app-header">
    <div class="header-row"><div class="app-brand"><span>Local Connect</span><span class="brand-context">手机发送</span></div><button id="language-toggle" class="language-toggle" type="button">EN</button></div>
    <h1>发送到电脑</h1>
    <p>连接电脑热点后，文字和文件可以直接送到电脑。</p>
  </header>
  <main>
  <div id="manual-code">
    <label for="code">电脑终端显示的访问码</label>
    <input id="code" name="code" autocomplete="off" autocapitalize="characters" inputmode="text" maxlength="8" required>
  </div>
  <section class="phone-panel" aria-labelledby="upload-title">
    <h2 id="upload-title">上传文件</h2>
    <p>TXT、CSV、EPUB、图片、视频等任意格式均可传输；选择后自动上传。</p>
    <input id="photos" type="file" multiple aria-describedby="file-help">
    <label class="file-picker" for="photos"><span class="picker-icon" aria-hidden="true">↑</span><strong>选择文件上传</strong><small>可一次多选，也可分几次添加</small></label>
    <p id="file-help" class="helper-text">单个文件最多 2 GiB；每批最多 100 个，合计 10 GiB。手机文件管理器通常可长按多选。</p>
    <ul id="upload-queue" class="upload-queue" aria-label="上传队列" data-i18n-user-content></ul>
    <button id="retry-upload" type="button" hidden>重试未完成的文件</button>
    <p id="photo-status" role="status" aria-live="polite"></p>
  </section>
  <form id="form" class="phone-panel">
    <h2>发送文本</h2>
    <p>电脑接收页会显示最近一次发送的内容。</p>
    <label for="text">文本</label>
    <textarea id="text" name="text" maxlength="65536" required></textarea>
    <p id="text-count" class="character-count" title="按 Unicode 字符计数，包含空格与换行">0 字符</p>
    <button id="send" type="submit">发送文本 <span aria-hidden="true">↗</span></button>
    <p id="status" role="status" aria-live="polite"></p>
  </form>
  </main>
  <script>
    LocalI18n.init();
    const t = LocalI18n.t;
    const codeInput = document.getElementById("code");
    const scannedCode = new URLSearchParams(location.hash.slice(1)).get("code");
    if (scannedCode && /^[A-HJ-NP-Z2-9]{8}$/.test(scannedCode)) {
      codeInput.value = scannedCode;
      document.getElementById("manual-code").hidden = true;
      history.replaceState(null, "", location.pathname + location.search);
      fetch("/api/connect/arrived", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code: scannedCode }), keepalive: true
      }).catch(() => {});
    }
    function showCodeInputIfExpired(response) {
      if (response.status === 403) {
        document.getElementById("manual-code").hidden = false;
        codeInput.value = "";
      }
    }
    const form = document.getElementById("form");
    const status = document.getElementById("status");
    const button = document.getElementById("send");
    const photoInput = document.getElementById("photos");
    const retryButton = document.getElementById("retry-upload");
    const photoStatus = document.getElementById("photo-status");
    let textMessage = ["", {}];
    let uploadMessage = ["", {}];
    const showTextStatus = (key, values = {}) => { textMessage = [key, values]; status.textContent = t(key, values); };
    const renderUploadStatus = () => {
      const [key, values] = uploadMessage;
      photoStatus.textContent = t(key, {...values, error: values.error ? t(values.error) : ''});
    };
    const showUploadStatus = (key, values = {}) => { uploadMessage = [key, values]; renderUploadStatus(); };
    const queueList = document.getElementById("upload-queue");
    const textInput = document.getElementById("text");
    const updateTextCount = () => {
      document.getElementById("text-count").textContent = t("{count} 字符", {count: LocalFiles.characterCount(textInput.value).toLocaleString(LocalI18n.language === "en" ? "en-US" : "zh-CN")});
    };
    textInput.addEventListener("input", updateTextCount);
    updateTextCount();
    let queue = [];
    let uploading = false;
    function updateQueueSummary() {
      const count = queue.filter(item => !item.done).length;
      if (!uploading && !retryButton.hidden && count) {
        showUploadStatus("{count} 个文件未完成；请检查连接后点击重试，或移除无法上传的文件。", {count});
      } else if (!uploading && count) {
        if (codeInput.value.trim()) showUploadStatus("{count} 个文件等待自动上传…", {count});
        else showUploadStatus("请先填写访问码，文件会自动上传。");
      }
    }
    photoInput.addEventListener("change", () => {
      for (const file of Array.from(photoInput.files).reverse()) {
        if (queue.some(item => !item.done && item.file.name === file.name && item.file.size === file.size && item.file.lastModified === file.lastModified)) continue;
        const row = document.createElement("li");
        row.className = "upload-row";
        const name = document.createElement("strong");
        name.textContent = file.name;
        const detail = document.createElement("small");
        detail.textContent = t("{size} · 等待上传", {size: LocalFiles.formatSize(file.size)});
        const progress = document.createElement("progress");
        progress.max = 100;
        progress.value = 0;
        progress.setAttribute("aria-label", t("{name} 上传进度", {name: file.name}));
        const item = { file, row, detail, progress, done: false };
        const remove = document.createElement("button");
        remove.type = "button";
        remove.className = "remove-file";
        remove.textContent = t("移除");
        remove.setAttribute("aria-label", t("从队列移除 {name}", {name: file.name}));
        remove.addEventListener("click", () => {
          if (item.uploading || item.done) return;
          queue = queue.filter(entry => entry !== item);
          row.remove();
          if (!queue.some(entry => !entry.done)) retryButton.hidden = true;
          updateQueueSummary();
          if (!uploading) startUpload();
        });
        row.append(name, detail, progress, remove);
        queueList.appendChild(row);
        queue.push(item);
      }
      photoInput.value = "";
      updateQueueSummary();
      startUpload();
    });
    codeInput.addEventListener("input", () => {
      if (/^[A-HJ-NP-Z2-9]{8}$/i.test(codeInput.value.trim()) && !uploading) startUpload();
    });

    function uploadFile(item) {
      return new Promise((resolve, reject) => {
        const request = new XMLHttpRequest();
        request.open("POST", "/api/files");
        request.setRequestHeader("Content-Type", "application/octet-stream");
        request.setRequestHeader("X-Access-Code", codeInput.value.trim());
        request.setRequestHeader("X-File-Name", encodeURIComponent(item.file.name));
        request.upload.addEventListener("progress", event => {
          if (!event.lengthComputable) return;
          const percent = Math.round(event.loaded * 100 / event.total);
          item.progress.value = percent;
          item.detail.textContent = percent === 100 ? t("{size} · 正在保存…", {size: LocalFiles.formatSize(item.file.size)}) : `${LocalFiles.formatSize(item.file.size)} · ${percent}%`;
        });
        request.addEventListener("load", () => {
          showCodeInputIfExpired(request);
          let result;
          try { result = JSON.parse(request.responseText); }
          catch { reject(new Error("服务响应异常，请重试")); return; }
          if (request.status < 200 || request.status >= 300) {
            reject(new Error(result.error || "上传失败")); return;
          }
          resolve(result);
        });
        request.addEventListener("error", () => reject(new Error("连接中断，请检查热点连接后重试")));
        request.addEventListener("abort", () => reject(new Error("上传已中止")));
        request.send(item.file);
      });
    }
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      if (new TextEncoder().encode(textInput.value).length > 65536) {
        showTextStatus("文本超过 64 KiB，请缩短后再发送。");
        return;
      }
      button.disabled = true;
      showTextStatus("正在发送…");
      try {
        const response = await fetch("/api/send", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            code: codeInput.value,
            text: document.getElementById("text").value
          })
        });
        const result = await response.json();
        showCodeInputIfExpired(response);
        showTextStatus(response.ok ? "发送成功，电脑接收页已更新。" : result.error);
      } catch {
        showTextStatus("连接失败，请检查电脑服务和 Wi-Fi 连接。");
      } finally {
        button.disabled = false;
      }
    });
    async function startUpload() {
      if (uploading) return;
      const pending = queue.filter(item => !item.done);
      if (!pending.length) return;
      if (!codeInput.value.trim()) {
        showUploadStatus("请先填写访问码。");
        return;
      }
      if (pending.length > 100) {
        showUploadStatus("一次最多选择 100 个文件。");
        retryButton.hidden = false;
        return;
      }
      if (pending.some(item => item.file.size > 2 * 1024 ** 3)) {
        showUploadStatus("单个文件不能超过 2 GiB。");
        retryButton.hidden = false;
        return;
      }
      if (pending.reduce((sum, item) => sum + item.file.size, 0) > 10 * 1024 ** 3) {
        showUploadStatus("每批文件总量不能超过 10 GiB。");
        retryButton.hidden = false;
        return;
      }
      uploading = true;
      retryButton.hidden = true;
      let sent = 0;
      let current;
      try {
        while (true) {
          const item = queue.find(entry => !entry.done && !entry.uploading);
          if (!item) break;
          current = item;
          item.uploading = true;
          item.row.dataset.state = "uploading";
          showUploadStatus("正在上传：{name}（本轮第 {number} 个）", {name: item.file.name, number: sent + 1});
          await uploadFile(item);
          item.done = true;
          item.uploading = false;
          item.row.dataset.state = "done";
          item.progress.value = 100;
          item.detail.textContent = t("{size} · 已完成", {size: LocalFiles.formatSize(item.file.size)});
          item.row.querySelector(".remove-file").hidden = true;
          sent += 1;
        }
        showUploadStatus("已上传 {count} 个文件，请在电脑接收页查看。", {count: sent});
      } catch (error) {
        if (current && !current.done) {
          current.uploading = false;
          current.row.dataset.state = "error";
          current.detail.textContent = t(error.message);
          current.error = error.message;
        }
        showUploadStatus("本轮已上传 {count} 个；{error}。检查后可重试未完成的文件。", {count: sent, error: error.message || "连接中断"});
        retryButton.hidden = false;
      } finally {
        uploading = false;
      }
    }
    retryButton.addEventListener("click", startUpload);
    window.addEventListener("languagechange", () => {
      updateTextCount(); updateQueueSummary();
      status.textContent = t(...textMessage);
      renderUploadStatus();
      for (const item of queue) {
        item.row.querySelector(".remove-file").textContent = t("移除");
        item.progress.setAttribute("aria-label", t("{name} 上传进度", {name: item.file.name}));
        item.row.querySelector(".remove-file").setAttribute("aria-label", t("从队列移除 {name}", {name: item.file.name}));
        if (item.done) item.detail.textContent = t("{size} · 已完成", {size: LocalFiles.formatSize(item.file.size)});
        else if (item.error) item.detail.textContent = t(item.error);
        else if (!item.uploading) item.detail.textContent = t("{size} · 等待上传", {size: LocalFiles.formatSize(item.file.size)});
      }
    });
  </script>
</body>
</html>
